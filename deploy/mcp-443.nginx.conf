# Include only in the existing true.reserv-app.org HTTPS (443) server block.
# All other paths continue to serve the pre-existing website.
location ~ ^/(mcp/?$|\.well-known/oauth-|token$|register$|revoke$|authorize(?:/decision)?$) {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host 127.0.0.1:3001;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Relay-Admin "";
    proxy_set_header X-Relay-Internal "";
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 600s;
}
