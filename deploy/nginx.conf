# Installed as /etc/nginx/sites-available/tg-ai-messages
# The backend stays bound to loopback. All public requests require authentication.
server {
    listen 8443 ssl;
    server_name true.reserv-app.org;
    ssl_certificate /etc/letsencrypt/live/true.reserv-app.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/true.reserv-app.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # MCP uses OAuth bearer tokens. Human authorization stays behind admin login.
    location ~ ^/(mcp/?$|\.well-known/|token$|register$|revoke$) {
            proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Relay-Admin "";
        proxy_set_header X-Relay-Internal "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host 127.0.0.1:3001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header X-Relay-Admin "";
        proxy_set_header X-Relay-Internal "";
        proxy_read_timeout 600s;
    }
}
